roles:
  - id: telegram_collector
    credentials:
      - telegram_api_id
      - telegram_api_hash
      - telegram_bot_token_main
      - telegram_session_path
      - telegram_alert_chat_id
      - telegram_channels_config
      - telegram_chat_id_alerts
      - telegram_chat_id_pipeline
      - telegram_chat_id_push
      - telegram_chat_id_ops
  - id: webhook_receiver
    credentials:
      - tv_webhook_key
      - tv_webhook_secret
      - ops_admin_key
  - id: google_sheets_writer
    credentials:
      - google_service_account_json
      - google_sheets_spreadsheet_id
  - id: git_dev
    credentials:
      - gh_token
  - id: market_data_public
    credentials:
      - enable_binance_public
      - enable_bybit_public
      - enable_okx_public
      - enable_kraken_public
      - enable_coinbase_public
      - enable_defillama_public
      - enable_stooq_public
      - enable_cftc_public
      - enable_sec_edgar_public
      - enable_gdelt_public
    note: public no-auth providers — flags only, no keys
  - id: market_data_free_keys
    credentials:
      - alphavantage_api_key
      - fred_api_key
      - eia_api_key
      - finnhub_api_key
      - twelvedata_api_key
      - coingecko_api_key
    note: free API keys — rate-limited, non-trading
  - id: market_data_readonly
    credentials:
      - binance_api_key
      - binance_api_secret
      - coinglass_api_key
    status: disabled
    note: private/signed access only — account/positions/orders; disabled until needed
  - id: deskpro_user
    credentials:
      - deskpro_api_key
      - deskpro_api_url
  - id: airtable_user
    credentials:
      - airtable_api_key
      - airtable_base_id
  - id: clickup_user
    credentials:
      - clickup_token
  - id: figma_designer
    credentials:
      - figma_token
      - figma_file_key
    status: future
  - id: llm_local
    credentials:
      - ollama_base_url
  - id: llm_cloud
    credentials:
      - openai_api_key
      - anthropic_api_key
      - gemini_api_key
  - id: datacenter
    credentials:
      - db_host
      - db_user
      - db_password
  - id: infrastructure
    credentials:
      - sshfs_identity_file
      - wireguard_private_key
      - termux_ssh_key
    note: SSH/SSHFS/VPN/Termux — credentials are system-level files, not env vars
