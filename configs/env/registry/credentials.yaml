credentials:
  - id: telegram_api_id
    provider: telegram
    type: api_id
    env_var: TELEGRAM_API_ID
  - id: telegram_api_hash
    provider: telegram
    type: api_hash
    env_var: TELEGRAM_API_HASH
  - id: telegram_bot_token_main
    provider: telegram
    type: bot_token
    env_var: TELEGRAM_BOT_TOKEN
