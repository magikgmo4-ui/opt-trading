credentials:
  - id: telegram_api_id
    provider: telegram
    type: api_id
    env_var: TELEGRAM_API_ID
  - id: telegram_api_hash
    provider: telegram
    type: api_hash
    env_var: TELEGRAM_API_HASH
  - id: telegram_bot_token_main
    provider: telegram
    type: bot_token
    env_var: TELEGRAM_BOT_TOKEN
  - id: telegram_session_path
    provider: telegram
    type: file_path
    env_var: TELEGRAM_SESSION_PATH
  - id: telegram_alert_chat_id
    provider: telegram
    type: chat_id
    env_var: TELEGRAM_ALERT_CHAT_ID
  - id: telegram_channels_config
    provider: telegram
    type: file_path
    env_var: TELEGRAM_CHANNELS_CONFIG
  - id: telegram_chat_id_alerts
    provider: telegram
    type: chat_id
    env_var: TELEGRAM_CHAT_ID_ALERTS
  - id: telegram_chat_id_pipeline
    provider: telegram
    type: chat_id
    env_var: TELEGRAM_CHAT_ID_PIPELINE
  - id: telegram_chat_id_push
    provider: telegram
    type: chat_id
    env_var: TELEGRAM_CHAT_ID_PUSH
  - id: telegram_chat_id_ops
    provider: telegram
    type: chat_id
    env_var: TELEGRAM_CHAT_ID_OPS
  - id: tv_webhook_secret
    provider: tradingview
    type: webhook_secret
    env_var: TV_WEBHOOK_SECRET
  - id: google_service_account_json
    provider: google
    type: file_path
    env_var: GOOGLE_SERVICE_ACCOUNT_JSON_PATH
  - id: google_sheets_spreadsheet_id
    provider: google
    type: resource_id
    env_var: GOOGLE_SHEETS_SPREADSHEET_ID
  - id: gh_token
    provider: github
    type: auth_token
    env_var: GH_TOKEN
  - id: binance_api_key
    provider: binance
    type: api_key
    env_var: BINANCE_API_KEY
  - id: coinglass_api_key
    provider: coinglass
    type: api_key
    env_var: COINGLASS_API_KEY
  - id: ollama_base_url
    provider: ollama
    type: url
    env_var: OLLAMA_BASE_URL
  - id: openai_api_key
    provider: openai
    type: api_key
    env_var: OPENAI_API_KEY
  - id: anthropic_api_key
    provider: anthropic
    type: api_key
    env_var: ANTHROPIC_API_KEY
  - id: gemini_api_key
    provider: google
    type: api_key
    env_var: GEMINI_API_KEY
  - id: db_host
    provider: local
    type: host
    env_var: DB_HOST
  - id: db_user
    provider: local
    type: username
    env_var: DB_USER
  - id: db_password
    provider: local
    type: password
    env_var: DB_PASSWORD
