credentials:
  - id: telegram_api_id
    provider: telegram
    type: api_id
    env_var: TELEGRAM_API_ID
  - id: telegram_api_hash
    provider: telegram
    type: api_hash
    env_var: TELEGRAM_API_HASH
  - id: telegram_bot_token_main
    provider: telegram
    type: bot_token
    env_var: TELEGRAM_BOT_TOKEN
  - id: telegram_session_path
    provider: telegram
    type: file_path
    env_var: TELEGRAM_SESSION_PATH
  - id: telegram_alert_chat_id
    provider: telegram
    type: chat_id
    env_var: TELEGRAM_ALERT_CHAT_ID
  - id: telegram_channels_config
    provider: telegram
    type: file_path
    env_var: TELEGRAM_CHANNELS_CONFIG
  - id: telegram_chat_id_alerts
    provider: telegram
    type: chat_id
    env_var: TELEGRAM_CHAT_ID_ALERTS
  - id: telegram_chat_id_pipeline
    provider: telegram
    type: chat_id
    env_var: TELEGRAM_CHAT_ID_PIPELINE
  - id: telegram_chat_id_push
    provider: telegram
    type: chat_id
    env_var: TELEGRAM_CHAT_ID_PUSH
  - id: telegram_chat_id_ops
    provider: telegram
    type: chat_id
    env_var: TELEGRAM_CHAT_ID_OPS
  - id: tv_webhook_secret
    provider: tradingview
    type: webhook_secret
    env_var: TV_WEBHOOK_SECRET
  - id: google_sheets_sync_sheet_id
    provider: google
    type: resource_id
    env_var: GOOGLE_SHEETS_SYNC_SHEET_ID
    note: ADC auth — no service account JSON; run gcloud auth application-default login
  - id: gh_token
    provider: github
    type: auth_token
    env_var: GH_TOKEN
  - id: binance_api_key
    provider: binance
    type: api_key
    env_var: BINANCE_API_KEY
  - id: coinglass_api_key
    provider: coinglass
    type: api_key
    env_var: COINGLASS_API_KEY
  - id: ollama_base_url
    provider: ollama
    type: url
    env_var: OLLAMA_BASE_URL
  - id: openai_api_key
    provider: openai
    type: api_key
    env_var: OPENAI_API_KEY
  - id: anthropic_api_key
    provider: anthropic
    type: api_key
    env_var: ANTHROPIC_API_KEY
  - id: gemini_api_key
    provider: google
    type: api_key
    env_var: GEMINI_API_KEY
  - id: db_host
    provider: local
    type: host
    env_var: DB_HOST
  - id: db_user
    provider: local
    type: username
    env_var: DB_USER
  - id: db_password
    provider: local
    type: password
    env_var: DB_PASSWORD
  # ── WEBHOOK / INTERNAL ────────────────────────────────────────────────────
  - id: tv_webhook_key
    provider: tradingview
    type: webhook_key
    env_var: TV_WEBHOOK_KEY
    note: used in webhook_server.py — TV_WEBHOOK_SECRET is the legacy alias in examples
  - id: ops_admin_key
    provider: internal
    type: admin_key
    env_var: OPS_ADMIN_KEY
  # ── AIRTABLE ──────────────────────────────────────────────────────────────
  - id: airtable_api_key
    provider: airtable
    type: api_key
    env_var: AIRTABLE_API_KEY
  - id: airtable_base_id
    provider: airtable
    type: resource_id
    env_var: AIRTABLE_BASE_ID
  # ── DESKPRO ───────────────────────────────────────────────────────────────
  - id: deskpro_api_key
    provider: deskpro
    type: api_key
    env_var: DESKPRO_API_KEY
  - id: deskpro_api_url
    provider: deskpro
    type: url
    env_var: DESKPRO_API_URL
  # ── CLICKUP ───────────────────────────────────────────────────────────────
  - id: clickup_token
    provider: clickup
    type: auth_token
    env_var: CLICKUP_TOKEN
    note: runtime reads from /tmp/clickup_token; env var canonical form
  # ── BOTPRESS ──────────────────────────────────────────────────────────────
  - id: botpress_api_token
    provider: botpress
    type: auth_token
    env_var: BOTPRESS_API_TOKEN
    note: Botpress Cloud/API token; required only for Botpress API management
  - id: botpress_workspace_id
    provider: botpress
    type: resource_id
    env_var: BOTPRESS_WORKSPACE_ID
  - id: botpress_bot_id
    provider: botpress
    type: resource_id
    env_var: BOTPRESS_BOT_ID
  - id: botpress_webhook_secret
    provider: botpress
    type: webhook_secret
    env_var: BOTPRESS_WEBHOOK_SECRET
    note: shared secret for Botpress -> OpenClaw adapter webhook verification
  - id: botpress_webhook_url
    provider: botpress
    type: url
    env_var: BOTPRESS_WEBHOOK_URL
    note: public/local webhook endpoint exposed to Botpress
  - id: botpress_bot_api_key
    provider: botpress
    type: api_key
    env_var: BOTPRESS_BOT_API_KEY
    note: Bot API Key (bp_bak_*) — runtime chat/conversations API; validated HTTP 200
  # ── FIGMA (active — LocalCMS mobile) ─────────────────────────────────────
  - id: figma_token
    provider: figma
    type: personal_access_token
    env_var: FIGMA_TOKEN
    status: active
  - id: figma_file_key
    provider: figma
    type: resource_id
    env_var: FIGMA_FILE_KEY
    status: active
  # ── MARKET DATA — FREE API KEYS (non-trading) ────────────────────────────
  - id: alphavantage_api_key
    provider: alphavantage
    type: api_key
    env_var: ALPHAVANTAGE_API_KEY
    note: stocks, forex, commodities, crypto, indicators — free tier
  - id: fred_api_key
    provider: fred
    type: api_key
    env_var: FRED_API_KEY
    note: macro US — DXY proxy, rates, inflation, yields — free key required
  - id: eia_api_key
    provider: eia
    type: api_key
    env_var: EIA_API_KEY
    note: oil, gas, energy stocks, production — free key required
  - id: finnhub_api_key
    provider: finnhub
    type: api_key
    env_var: FINNHUB_API_KEY
    note: realtime stocks, fundamentals, macro, alternatives — free tier
  - id: twelvedata_api_key
    provider: twelvedata
    type: api_key
    env_var: TWELVEDATA_API_KEY
    note: stocks, forex, crypto, ETF, indices — free tier
  - id: coingecko_api_key
    provider: coingecko
    type: api_key
    env_var: COINGECKO_API_KEY
    note: crypto prices, market cap, on-chain via GeckoTerminal — demo/pro
  # ── MARKET DATA — PUBLIC NO-AUTH PROVIDERS ────────────────────────────────
  - id: enable_binance_public
    provider: binance
    type: feature_flag
    env_var: ENABLE_BINANCE_PUBLIC
    note: spot/futures/klines/funding/OI — no key required
  - id: enable_bybit_public
    provider: bybit
    type: feature_flag
    env_var: ENABLE_BYBIT_PUBLIC
    note: perps/options/funding/orderbook — no key required
  - id: enable_okx_public
    provider: okx
    type: feature_flag
    env_var: ENABLE_OKX_PUBLIC
    note: spot/futures/swaps/tickers — no key required
  - id: enable_kraken_public
    provider: kraken
    type: feature_flag
    env_var: ENABLE_KRAKEN_PUBLIC
    note: spot/futures/tickers/trades — no key required
  - id: enable_coinbase_public
    provider: coinbase
    type: feature_flag
    env_var: ENABLE_COINBASE_PUBLIC
    note: spot crypto/candles/websocket — no key required
  - id: enable_defillama_public
    provider: defillama
    type: feature_flag
    env_var: ENABLE_DEFILLAMA_PUBLIC
    note: TVL/stablecoins/DEX volume/fees — no key required
  - id: enable_stooq_public
    provider: stooq
    type: feature_flag
    env_var: ENABLE_STOOQ_PUBLIC
    note: OHLC historique daily/hourly/5m CSV — no key required
  - id: enable_cftc_public
    provider: cftc
    type: feature_flag
    env_var: ENABLE_CFTC_PUBLIC
    note: COT reports — commercials/managed money/specs — no key required
  - id: enable_sec_edgar_public
    provider: sec_edgar
    type: feature_flag
    env_var: ENABLE_SEC_EDGAR_PUBLIC
    note: 10-K/10-Q/8-K/XBRL filings — no key required
  - id: enable_gdelt_public
    provider: gdelt
    type: feature_flag
    env_var: ENABLE_GDELT_PUBLIC
    note: global news/geopolitics/event risk — no key required
  # ── MARKET DATA — PRIVATE TRADING (disabled) ─────────────────────────────
  - id: binance_api_key
    provider: binance
    type: api_key
    env_var: BINANCE_API_KEY
    status: disabled
    note: required only for account/positions/orders/trading — not for public data
  - id: binance_api_secret
    provider: binance
    type: api_secret
    env_var: BINANCE_API_SECRET
    status: disabled
    note: required to sign private requests — pair with BINANCE_API_KEY
  # ── INFRASTRUCTURE ────────────────────────────────────────────────────────
  - id: sshfs_identity_file
    provider: internal
    type: file_path
    env_var: IDENTITY_FILE
    note: SSH key path for SSHFS — value in /etc/opt-trading/shared_sshfs_permanent.env
  - id: wireguard_private_key
    provider: internal
    type: private_key
    env_var: WG_PRIVATE_KEY
    note: generated by wg genkey — stored in /etc/wireguard/, never in git or env files
  - id: termux_ssh_key
    provider: internal
    type: ssh_key
    env_var: null
    note: ~/.ssh/id_ed25519_termux — generated locally, authorized via authorized_keys
