version: spacex_true_value_final_v1
name: spacex_true_value_final
mode: monitor_only

supersedes:
  - GO_STOCK_TRUE_VALUE_ENGINE_01_BUNDLE_01_08
  - GO_SPACEX_INTELLIGENCE_LAYER_01
  - GO_SPACEX_MASTER_PROJECT_V5
  - GO_SPACEX_FINAL_CANONICAL_01

parent_project: GO_SPACEX_INTELLIGENCE_TRUE_VALUE_FINAL_01

primary_space_config: configs/ipo/spacex_final_canonical.yaml
true_value_config:
  score_weights: configs/stock_true_value/score_weights.yaml
  watchlist: configs/stock_true_value/watchlist_config.yaml
  data_sources: configs/stock_true_value/data_sources.yaml

runtime:
  activation: prohibited_in_this_bundle
  fixture_only: python -m modules.stock_true_value.cli --fixture-only
  tests: python -m pytest tests/stock_true_value -q

outputs:
  stock_true_value_latest: outputs/stock_true_value/latest/scores.json
  stock_true_value_summary: outputs/stock_true_value/latest/summary.md
  spacex_true_value_latest: outputs/spacex_true_value/latest/scores.json

guards:
  monitor_only: true
  no_broker_execution: true
  no_live_collectors_required: true
  no_registry_activation: true
  require_confidence_score: true
  require_source_health: true
