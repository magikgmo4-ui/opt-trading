schema_version: "0.1.0"
contracts:
  - contract_id: desk_pro_runner_runtime
    module_name: desk_pro_runner
    code_id: desk_pro_runner
    job_id: null
    wrapper_ids:
      - cmd-desk_pro_runner
    machine_target: admin_trading
    runtime_map_key: admin-trading
    execution_mode: on_demand
    entrypoint: modules/desk_pro_runner/app/desk_pro_runner.py
    command: cmd-desk_pro_runner run
    inputs:
      - desk_snapshot
      - visual_context
      - market_metrics
    outputs:
      - desk_snapshot.v1
      - visual_context.v1
      - runtime_log
    side_effects:
      - writes_artifacts
      - no_live_trade
    healthcheck:
      type: runtime_health
      required: true
      blocks:
        - MACHINE_IDENTITY
        - FORBIDDEN_SERVICES
    tests:
      - tests/test_desk_pro_health_classification.py
    risk: medium
    status: active
